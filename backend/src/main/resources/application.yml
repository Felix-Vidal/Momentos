spring:
  application:
    name: momentos
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true          # Java 25: requisições em virtual threads
  datasource:
    url: ${MOMENTOS_DB_URL:jdbc:postgresql://localhost:5432/momentos}
    username: ${MOMENTOS_DB_USER:momentos}
    password: ${MOMENTOS_DB_PASSWORD:momentos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate     # o schema é responsabilidade exclusiva do Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MOMENTOS_MAX_FILE_SIZE:200MB}
      max-request-size: ${MOMENTOS_MAX_REQUEST_SIZE:600MB}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${MOMENTOS_PORT:8080}
  error:
    include-message: never

momentos:
  cors:
    allowed-origins: ${MOMENTOS_CORS_ORIGINS:}
  jwt:
    # Chave HMAC em Base64. Sem ela, uma chave temporária é gerada na subida
    # (válida só para desenvolvimento): defina MOMENTOS_JWT_SECRET em produção.
    secret: ${MOMENTOS_JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 7d
  storage:
    # "local" grava em disco; "s3" fala com qualquer serviço compatível
    # (AWS, Cloudflare R2, Backblaze B2, Wasabi).
    type: ${MOMENTOS_STORAGE_TYPE:local}
    local:
      path: ${MOMENTOS_STORAGE_LOCAL_PATH:./storage}
    s3:
      endpoint: ${MOMENTOS_S3_ENDPOINT:}
      region: ${MOMENTOS_S3_REGION:us-east-1}
      bucket: ${MOMENTOS_S3_BUCKET:}
      access-key: ${MOMENTOS_S3_ACCESS_KEY:}
      secret-key: ${MOMENTOS_S3_SECRET_KEY:}
      path-style-access: ${MOMENTOS_S3_PATH_STYLE:true}
  media:
    # Limites de upload, configuráveis; o multipart do servidor acompanha o maior deles.
    max-image-size: ${MOMENTOS_MAX_IMAGE_SIZE:25MB}
    max-video-size: ${MOMENTOS_MAX_VIDEO_SIZE:200MB}
    thumbnail-width: 640
    # ffmpeg é opcional: sem ele o vídeo é guardado como veio, sem miniatura.
    ffmpeg-path: ${MOMENTOS_FFMPEG_PATH:ffmpeg}
    compress-video: ${MOMENTOS_COMPRESS_VIDEO:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    app.momentos: INFO
