# Perfil de desenvolvimento: banco e MinIO do docker-compose, seed de demonstração ligado.
spring:
  datasource:
    url: jdbc:postgresql://localhost:${MOMENTOS_DB_PORT:5433}/momentos
    username: momentos
    password: momentos
  jpa:
    show-sql: false

momentos:
  cors:
    allowed-origins: http://localhost:4200
  seed:
    enabled: true

logging:
  level:
    app.momentos: DEBUG
