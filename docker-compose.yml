# Infraestrutura de desenvolvimento do Momentos.
#
#   docker compose up -d postgres minio     # só a infraestrutura (backend roda pela IDE/mvnw)
#   docker compose up -d                    # tudo, incluindo o backend
services:
  postgres:
    image: postgres:18-alpine
    container_name: momentos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-momentos}
      POSTGRES_USER: ${POSTGRES_USER:-momentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momentos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Em postgres:18+ o mount é na raiz do diretório, não em .../data
      - momentos-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momentos} -d ${POSTGRES_DB:-momentos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: momentos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-momentos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-momentos123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # console web: http://localhost:9001
    volumes:
      - momentos-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: momentos-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: ${POSTGRES_USER:-momentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momentos}
      MOMENTOS_STORAGE_TYPE: minio
      MOMENTOS_MINIO_ENDPOINT: http://minio:9000
      MOMENTOS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-momentos}
      MOMENTOS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-momentos123}
      MOMENTOS_CORS_ORIGINS: http://localhost:4200
    ports:
      - "${MOMENTOS_PORT:-8080}:8080"

volumes:
  momentos-postgres-data:
  momentos-minio-data:
